<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital CESDE - Registro de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 text-primary">Registro de Pacientes</h2>
                        <h6 class="text-center mb-4 text-secondary">Crea tu cuenta para agendar citas</h6>
                        
                        <form id="formulario-registro">
                            <div class="mb-3">
                                <label for="nombre-registro" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre-registro" required>
                            </div>

                            <div class="mb-3">
                                <label for="email-registro" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email-registro" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password-registro" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password-registro" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mb-3" id="btn-registrar">Registrar Cuenta</button>
                            
                            <div class="text-center mt-3">
                                <p class="mb-0">¿Ya tienes cuenta?</p>
                                <a href="index.html" class="text-decoration-none">Inicia sesión aquí</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/funciones-registro.js"></script>
</body>
</html>
