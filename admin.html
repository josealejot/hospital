<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital CESDE - Panel de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">⚙️ Hospital CESDE - Admin</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3 fw-bold" id="bienvenida-admin">
                    Admin
                </span>
                <button class="btn btn-outline-light btn-sm" id="btn-cerrar-sesion">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        
        <div class="card shadow mb-5">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">👥 Gestión de Usuarios y Roles</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol Actual</th>
                                <th>Cambiar Rol</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow mb-5">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">🏥 Control General de Citas</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Paciente</th>
                                <th>Fecha y Hora</th>
                                <th>Especialidad</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-todas-citas">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="js/funciones-admin.js"></script>
</body>
</html>
