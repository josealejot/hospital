<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital CESDE - Panel Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">🩺 Hospital CESDE - Área Médica</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3 fw-bold" id="bienvenida-doctor">
                    Dr. / Dra.
                </span>
                <button class="btn btn-outline-light btn-sm" id="btn-cerrar-sesion">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">🕒 Registrar Disponibilidad</h5>
                    </div>
                    <div class="card-body">
                        <form id="formulario-disponibilidad">
                            <div class="mb-3">
                                <label for="fecha-disponible" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fecha-disponible" required>
                            </div>
                            <div class="mb-3">
                                <label for="turno-disponible" class="form-label">Turno</label>
                                <select class="form-select" id="turno-disponible" required>
                                    <option value="" selected disabled>Seleccione un turno...</option>
                                    <option value="Mañana (8:00 AM - 12:00 PM)">Mañana (8:00 AM - 12:00 PM)</option>
                                    <option value="Tarde (2:00 PM - 6:00 PM)">Tarde (2:00 PM - 6:00 PM)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Horario</button>
                        </form>
                        
                        <hr>
                        <h6 class="text-secondary mt-3">Mis Horarios Registrados</h6>
                        <ul class="list-group mt-2" id="lista-horarios">
                            </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">📋 Citas Asignadas</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Paciente</th>
                                        <th>Fecha y Hora</th>
                                        <th>Estado</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-citas-doctor">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/funciones-doctor.js"></script>
</body>
</html>
