<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital CESDE - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 text-primary">Hospital CESDE</h2>
                        <h5 class="text-center mb-4 text-secondary">Inicio de Sesión</h5>
                        
                        <form id="formulario-login">
                            <div class="mb-3">
                                <label for="email-login" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email-login" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password-login" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password-login" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" id="btn-ingresar">Ingresar</button>
                            
                            <div class="text-center mt-3">
                                <p class="mb-0">¿Eres paciente nuevo?</p>
                                <a href="registro.html" class="text-decoration-none">Regístrate aquí</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
</body>
</html>
